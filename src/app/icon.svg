<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icona neutra: i tre inchiostri della stampa (ciano, magenta, giallo) sovrapposti. -->
  <!-- Le zone di sovrapposizione sono colorate a mano, senza mix-blend-mode, per tutti i browser. -->
  <defs>
    <clipPath id="ciano"><circle cx="12.5" cy="12.75" r="6.75"/></clipPath>
    <clipPath id="magenta"><circle cx="19.5" cy="12.75" r="6.75"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#fff" stroke="#171717"/>
  <circle cx="12.5" cy="12.75" r="6.75" fill="#00AEEF"/>
  <circle cx="19.5" cy="12.75" r="6.75" fill="#EC008C"/>
  <circle cx="16" cy="19" r="6.75" fill="#FFE600"/>
  <circle cx="19.5" cy="12.75" r="6.75" fill="#000083" clip-path="url(#ciano)"/>
  <circle cx="16" cy="19" r="6.75" fill="#009D00" clip-path="url(#ciano)"/>
  <circle cx="16" cy="19" r="6.75" fill="#EC0000" clip-path="url(#magenta)"/>
  <g clip-path="url(#ciano)"><circle cx="16" cy="19" r="6.75" fill="#000" clip-path="url(#magenta)"/></g>
</svg>
