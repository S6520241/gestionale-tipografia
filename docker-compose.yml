# Database PostgreSQL per lo sviluppo in locale.
# Avvio:  docker compose up -d     Stop:  docker compose down
# I dati restano nel volume "pgdata" anche dopo lo stop.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestionale
      POSTGRES_PASSWORD: gestionale
      POSTGRES_DB: gestionale
    ports:
      # Solo da questo PC (127.0.0.1): il database non e' raggiungibile dalla rete.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionale"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
